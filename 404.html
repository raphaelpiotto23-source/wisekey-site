<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Wisekey</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1A2E6C">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
/*
Sistema: manual de marca Wisekey, Ladislau Branding Estratégico (2025) · logotipo e chave da LBE
Tipo: Poppins em tudo. 600 título e número · 400 corpo · 500 rótulo · 700 só no número grande. Escala 60/44/28/22/18/15/13. Corpo 17px, entrelinha 1,6.
Cor (revisão 16/10, "mais branco"): tinta #1B1F3B sobre branco · navy #1A2E6C em título e rodapé · violeta #6665E9 só em botão, chave e número de destaque · degradê da LBE só no fecho · superfície #F7F7FA neutra
Contraste medido: tinta 2 #555B75 sobre branco 6,7 e sobre superfície 6,1 · branco sobre violeta 4,56 · lilás sobre navy 5,4
Espaço: 4/8/12/16/24/32/48/64 · seção 104px desktop, 56px celular · raios 8/16/24
Assinatura: a chave da Wisekey como marcador de etiqueta e favicon (no manual da LBE ela nunca aparece colada ao wordmark; o topo e o rodapé levam só o wordmark) e o degradê da LBE no fecho
Lógica do funil (home): hero (tese + prova) → a dor → investimos primeiro → o método → ecossistema → a conta → você se identifica → três formas → por que confiar → como começa → perguntas → contato → fecho
Revisão: textos novos com class="r"; <body class="revisao"> mostra [RASCUNHO]. Publicar sem a classe. Sem honorário no site.
Movimento: entrada suave dos blocos (site.js, só transform e opacity), faixa de fotos em CSS, tudo desligado em prefers-reduced-motion.
*/
@font-face{font-family:"Poppins";font-weight:400;font-style:normal;font-display:swap;src:url(/assets/fonts/poppins-400.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:500;font-style:normal;font-display:swap;src:url(/assets/fonts/poppins-500.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:600;font-style:normal;font-display:swap;src:url(/assets/fonts/poppins-600.woff2) format("woff2")}
@font-face{font-family:"Poppins";font-weight:700;font-style:normal;font-display:swap;src:url(/assets/fonts/poppins-700.woff2) format("woff2")}

:root{
  --navy:#1A2E6C; --roxo:#52377F; --violeta:#6665E9; --lilas:#B19CED;
  --ink:#1B1F3B; --ink-2:#555B75; --paper:#FFFFFF; --surface:#F7F7FA; --soft:#F1EEFC; --line:#E4E4EC;
  --on-dark:#E6E0FA;
  --grad:linear-gradient(125deg,#1A2E6C 0%,#2C2A78 38%,#52377F 68%,#6665E9 100%);
  --f:"Poppins","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(0.23,1,0.32,1);
  --wrap:1140px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;height:auto}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:clamp(20px,5vw,56px)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-0.022em;line-height:1.08;font-weight:600}
h1{font-size:clamp(38px,6vw,66px)}
h2{font-size:clamp(28px,4vw,44px);color:var(--navy)}
h3{font-size:clamp(18px,2vw,22px);letter-spacing:-0.012em;line-height:1.28;color:var(--navy)}
p{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--violeta);outline-offset:4px}
.n{font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.revisao .r::before{content:"[RASCUNHO] ";font-size:11px;letter-spacing:.06em;font-weight:500;opacity:.7;vertical-align:.25em}

/* etiqueta com a chave */
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;display:flex;align-items:center;gap:12px;color:var(--ink-2)}
.eyebrow::before{content:"";width:34px;height:13px;flex:none;background:var(--violeta);-webkit-mask:url(/assets/img/chave.svg) no-repeat left center/contain;mask:url(/assets/img/chave.svg) no-repeat left center/contain}
.lede{font-size:clamp(17.5px,1.9vw,20px);line-height:1.6;max-width:62ch;color:var(--ink-2)}

/* botões */
.btn{font-family:inherit;font-weight:600;font-size:15px;line-height:1.1;text-decoration:none;padding:15px 22px;min-height:50px;border:1.5px solid transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background-color 160ms var(--ease),color 160ms var(--ease),border-color 160ms var(--ease),transform 160ms var(--ease)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn.cta{background:var(--violeta);color:#fff}
.btn.cta:hover{background:var(--roxo)}
.btn.white{background:#fff;color:var(--navy)}
.btn.white:hover{background:var(--soft)}
.btn.line{border-color:currentColor;background:transparent}
.btn.line:hover{background:rgba(255,255,255,.1)}
.btn.line-navy{border-color:var(--navy);color:var(--navy);background:transparent}
.btn.line-navy:hover{background:var(--soft)}
.arrow{font-weight:600;color:var(--violeta);text-decoration:none;display:inline-flex;gap:8px;align-items:center;border-bottom:1.5px solid currentColor;padding-bottom:2px}
.arrow:hover{color:var(--roxo)}

/* topo */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:68px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;line-height:0}
.logo .k{height:18px;width:auto}
.logo .w{height:28px;width:auto}
.top nav{display:flex;gap:26px;align-items:center;font-size:14.5px;font-weight:500;color:var(--ink)}
.top nav a:not(.btn){text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;transition:border-color 160ms var(--ease),color 160ms var(--ease)}
.top nav a:not(.btn):hover,.top nav a.on{color:var(--navy);border-color:var(--violeta)}
.top nav .btn{min-height:44px;padding:11px 16px;font-size:14px}
@media (max-width:900px){.top nav a:not(.btn){display:none}}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--violeta);z-index:30}

/* hero escuro com a assinatura */
.hero{background:var(--paper);color:var(--ink)}
.hero .wrap{padding-block:clamp(56px,9vw,112px) clamp(8px,2vw,24px)}
.hero .grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px 56px;align-items:center}
@media (max-width:820px){.hero .grid{grid-template-columns:1fr}}
.hero .pic{border-radius:24px;overflow:hidden;aspect-ratio:3/4;max-width:440px;max-height:600px;justify-self:end;width:100%;background:var(--surface)}
@media (max-width:820px){.hero .pic{aspect-ratio:4/3;max-width:none;justify-self:stretch}}
.hero .pic{position:relative}
.hero .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero h1{margin-top:22px;max-width:17ch;color:var(--navy);font-size:clamp(36px,5vw,58px)}
.hero .lede{margin-top:26px;max-width:56ch}
.hero .go{margin-top:38px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hero .hint{font-size:13.5px;color:var(--ink-2);margin-top:14px}
.facts{margin-top:clamp(48px,7vw,80px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:3px solid var(--navy)}
@media (max-width:820px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{padding:22px 20px 0 0}
.fact .v{font-size:clamp(28px,3.6vw,42px);line-height:1;color:var(--navy)}
.fact .k{margin-top:10px;font-size:14px;color:var(--ink-2);line-height:1.45;max-width:24ch}

/* seções */
section{padding-block:clamp(56px,9vw,104px)}
.tint{background:var(--surface)}
.sec-h{max-width:820px}
.sec-h .eyebrow{margin-bottom:18px}
.sec-h .lede{margin-top:20px}
.rule{margin-top:44px;font-weight:600;font-size:clamp(20px,2.4vw,27px);letter-spacing:-0.012em;max-width:36ch;line-height:1.3;color:var(--navy)}
.rule span{color:var(--violeta)}
.src{margin-top:22px;font-size:13px;color:var(--ink-2);max-width:74ch;line-height:1.6}
.more{margin-top:36px}

/* a dor: tabela */
.dest{margin-top:48px;border-top:3px solid var(--navy)}
.dest .row{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr));gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.dest .row.h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;padding-block:14px}
.dest .row b{display:block;font-weight:600;color:var(--navy);font-size:17px}
.dest .row small{display:block;color:var(--ink-2);font-size:14.5px;margin-top:2px}
.dest .row .n{font-size:20px;color:var(--navy)}
.dest .row.win{background:var(--surface);border-left:3px solid var(--violeta);border-bottom:0;padding-inline:16px;margin-top:8px}
.dest .row.win .n,.dest .row.win b{color:var(--roxo)}
.dest .lb{display:none}
@media (max-width:720px){
  .dest .row{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
  .dest .row>div:first-child{grid-column:1/-1}
  .dest .row.h{display:none}
  .dest .lb{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
  .dest .row .n{font-size:17px}
}
.vs-h{margin-top:48px;font-weight:600;color:var(--navy);font-size:17px}
.vs-h small{display:block;font-weight:400;color:var(--ink-2);font-size:15px;margin-top:4px}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
@media (max-width:720px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:16px;padding:28px;background:var(--surface);border:1px solid var(--line)}
.vs>div.sp{background:#fff;border:2px solid var(--violeta)}
.vs .t{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--ink-2)}
.vs .sp .t{color:var(--violeta)}
.vs .v{margin-top:12px;font-size:clamp(30px,4vw,44px);line-height:1;color:var(--navy)}
.vs .sp .v{color:var(--navy)}
.vs .k{margin-top:10px;font-size:15.5px;color:var(--ink-2)}
.vs .sp .k{color:var(--ink-2)}

/* prova */
.proof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;margin-top:52px;align-items:stretch}
@media (max-width:900px){.proof{grid-template-columns:1fr}}
.curve{display:flex;flex-direction:column}
.curve .plot{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px 18px;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.curve h3{margin-top:10px;font-size:14.5px;line-height:1.4}
.curve h3 small{display:block;font-weight:400;color:var(--ink-2);font-size:13.5px;margin-top:2px}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end;flex:1;min-height:200px;border-bottom:1px solid var(--line)}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-height:200px;gap:8px}
.bars .b i{display:block;width:100%;max-width:56px;border-radius:8px 8px 0 0;background:var(--lilas);height:var(--h);transform-origin:50% 100%}
.bars .b:last-child i{background:var(--violeta)}
.bars .b span{font-size:15px;font-weight:600;color:var(--navy)}
.bars-x{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-2);text-align:center}
.curve p{margin-top:14px;font-size:14.5px;color:var(--ink-2);line-height:1.55}
.ba{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ba figure{margin:0}
.ba img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block;background:var(--soft)}
.ba figcaption{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.ba figcaption b{color:var(--navy);font-weight:600;display:block;font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;margin-top:28px;border-top:3px solid var(--navy)}
.tile{padding:20px 0;border-bottom:1px solid var(--line)}
.tile .v{font-size:clamp(28px,3.2vw,38px);line-height:1;color:var(--navy)}
.tile .k{margin-top:8px;font-size:14.5px;color:var(--ink-2);line-height:1.45}

/* faixa de fotos */
.marquee{overflow:hidden;margin-top:56px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.track{display:flex;width:max-content;animation:slide 70s linear infinite}
.marquee:hover .track{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.shot{flex:none;width:340px;margin-right:14px;aspect-ratio:4/3;overflow:hidden;border-radius:14px;background:var(--soft);position:relative}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:720px){.shot{width:250px}}

/* método */
.road{list-style:none;margin:52px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;counter-reset:s}
@media (max-width:900px){.road{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.road{grid-template-columns:1fr}}
.road li{counter-increment:s;border-top:3px solid var(--navy);padding:22px 0 32px}
.road .when{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;gap:10px;align-items:baseline}
.road .when::before{content:counter(s,decimal-leading-zero);font-weight:600;color:var(--violeta);font-size:14px}
.road h3{margin-top:8px}
.road dl{margin:14px 0 0;display:grid;gap:10px}
.legend{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:820px}
@media (max-width:720px){.legend{grid-template-columns:1fr}}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;align-items:start;font-size:15px;color:var(--ink-2);line-height:1.5;padding:14px 16px;background:var(--surface);border-radius:12px}
.legend li::before{content:"";width:12px;height:12px;border-radius:50%;margin-top:5px}
.legend li.ex::before{background:var(--violeta)}
.legend li.as::before{border:2px solid var(--navy);box-sizing:border-box}
.legend b{color:var(--navy);font-weight:600}
/* etapa 3: dois caminhos (financia ou já tem o dinheiro), só CSS */
.paths{display:flex;gap:8px;flex-wrap:nowrap;margin-top:14px}
.paths input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.paths label{cursor:pointer;flex:1;text-align:center;white-space:nowrap;font-size:13px;font-weight:600;color:var(--navy);border:1.5px solid var(--line);border-radius:999px;padding:9px 10px;line-height:1.1;transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease)}
.paths label:hover{border-color:var(--violeta)}
.paths input:focus-visible+label{outline:2px solid var(--violeta);outline-offset:3px}
.credit:has(#pay-fin:checked) label[for=pay-fin],.credit:has(#pay-cash:checked) label[for=pay-cash]{background:var(--violeta);border-color:var(--violeta);color:#fff}
.credit .p-cash,.credit .w-cash{display:none}
.credit:has(#pay-cash:checked) .p-fin,.credit:has(#pay-cash:checked) .w-fin{display:none}
.credit:has(#pay-cash:checked) .p-cash{display:grid}
.credit:has(#pay-cash:checked) .w-cash{display:inline}
.credit .skip{margin-top:12px;font-size:14px;color:var(--ink-2);line-height:1.5}
.road dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.road dt.ex::before,.road dt.as::before{content:"";width:9px;height:9px;border-radius:50%;flex:none}
.road dt.ex::before{background:var(--violeta)}
.road dt.as::before{border:2px solid var(--navy);box-sizing:border-box}
.road dd{margin:2px 0 0;font-size:15.5px;color:var(--ink)}
.road .you dd{color:var(--navy);font-weight:600}

/* ecossistema */
.eco{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:52px}
@media (max-width:980px){.eco{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.eco{grid-template-columns:1fr}}
.eco .it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 22px 26px;transition:transform 200ms var(--ease),box-shadow 200ms var(--ease)}
.eco .it:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(26,46,108,.35)}
.eco .num{font-size:13px;font-weight:600;color:var(--violeta)}
.eco h3{margin-top:10px;font-size:18.5px}
.eco p{margin-top:8px;font-size:15px;color:var(--ink-2);line-height:1.55}

/* a conta */
.case{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;margin-top:52px;align-items:stretch}
@media (max-width:900px){.case{grid-template-columns:1fr}}
.bill{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.bill .ln{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);align-items:center;flex:1}
.bill .op{font-weight:600;color:var(--violeta);font-size:20px;line-height:1}
.bill .ln span{font-size:15.5px;color:var(--ink)}
.bill .ln small{display:block;color:var(--ink-2);font-size:13.5px}
.bill .ln .n{font-size:20px;color:var(--navy);white-space:nowrap}
.bill .tot{background:var(--surface);border-bottom:0;border-top:2px solid var(--navy)}
.bill .tot span{font-weight:600;color:var(--navy)}
.bill .tot .n{color:var(--violeta)}
.bill .tot .n{font-size:26px}
.side .big{font-size:clamp(44px,6vw,68px);line-height:1;color:var(--navy);font-weight:700;letter-spacing:-.03em}
.side p{margin-top:14px;color:var(--ink-2);font-size:16.5px}
.side .val{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-weight:600;color:var(--navy)}
.side .dis{margin-top:16px;font-size:14px;color:var(--ink-2);line-height:1.55;padding:14px 16px;background:var(--surface);border-radius:12px}
.ifs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 28px;margin-top:56px;border-top:3px solid var(--navy)}
@media (max-width:900px){.ifs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ifs{grid-template-columns:1fr}}
.ifs div{padding:22px 0;border-bottom:1px solid var(--line)}
.ifs h3{font-size:17.5px}
.ifs p{margin-top:8px;font-size:15px;color:var(--ink-2)}

/* você se identifica */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:52px}
@media (max-width:860px){.three{grid-template-columns:1fr}}
.three .it{border-radius:16px;padding:26px 24px;background:#fff;border:1px solid var(--line)}
.three .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:14px}
.three h3{margin-top:16px}
.three p{margin-top:8px;font-size:15.5px;color:var(--ink-2)}
.yes{margin-top:40px;display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center}
.yes .rule{margin:0}

/* três formas */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:52px;align-items:stretch}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--line);border-radius:20px;padding:30px 26px;display:flex;flex-direction:column;background:#fff}
.plan.pick{border:2px solid var(--violeta);box-shadow:0 18px 40px -28px rgba(102,101,233,.55)}
.plan .tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--violeta)}
.plan.pick .tag{color:var(--violeta);font-weight:600}
.plan h3{margin-top:12px;font-size:26px}
.plan .for{margin-top:10px;font-size:15.5px;color:var(--ink-2)}
.plan ul{list-style:none;margin:22px 0 28px;padding:20px 0 0;border-top:1px solid var(--line);display:grid;gap:10px;flex:1}
.plan li{padding-left:26px;position:relative;font-size:15.5px}
.plan li::before{content:"";position:absolute;left:0;top:.55em;width:14px;height:8px;border-left:2px solid var(--violeta);border-bottom:2px solid var(--violeta);transform:rotate(-45deg) translateY(-3px)}
.plan .btn{width:100%}
.note{margin-top:24px;font-size:15px;color:var(--ink-2)}

/* por que confiar */
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 32px;margin-top:52px;border-top:3px solid var(--navy)}
@media (max-width:900px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.trust{grid-template-columns:1fr}}
.trust div{padding:24px 0;border-bottom:1px solid var(--line)}
.trust p{margin-top:8px;font-size:15.5px;color:var(--ink-2)}

/* como começa */
.steps{list-style:none;margin:48px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;counter-reset:t}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:t;padding:24px 0;border-top:3px solid var(--navy)}
.steps li::before{content:counter(t,decimal-leading-zero);font-size:14px;color:var(--violeta);font-weight:600;display:block}
.steps h3{margin-top:10px}
.steps p{margin-top:8px;font-size:15.5px;color:var(--ink-2)}

/* perguntas */
.faq{margin-top:40px;border-top:3px solid var(--navy)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:20px 0;font-weight:600;font-size:17px;color:var(--navy);display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font-weight:400;color:var(--violeta);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq p{padding:0 0 22px;font-size:16px;color:var(--ink-2);max-width:76ch;line-height:1.6}

/* contato */
.ct{border-top:3px solid var(--navy);margin:44px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px}
@media (max-width:720px){.ct{grid-template-columns:1fr}}
.ct .row{padding:18px 0;border-bottom:1px solid var(--line)}
.ct dt{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.ct dd{margin:6px 0 0;font-weight:600;font-size:19px;color:var(--ink);overflow-wrap:anywhere}
.ct dd a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.ct dd small{display:block;font-weight:400;font-size:15px;color:var(--ink-2);margin-top:2px}

/* fecho */
.close{color:#fff;background:var(--grad)}
.close .sig{font-weight:500;font-size:16px;color:var(--lilas)}
.close h2{margin-top:14px;max-width:18ch;color:#fff;font-size:clamp(32px,5vw,56px)}
.close .go{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
footer{background:#111a40;color:var(--on-dark);padding-block:48px 96px}
@media (min-width:821px){footer{padding-bottom:48px}}
footer .in{display:flex;justify-content:space-between;gap:28px 48px;flex-wrap:wrap;align-items:flex-end}
footer .links{margin-top:18px;display:flex;gap:20px;flex-wrap:wrap;font-size:15px;font-weight:500}
footer .links a{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(230,224,250,.35)}
footer .legal{font-size:12.5px;line-height:1.8;text-align:right;max-width:58ch}
@media (max-width:720px){footer .legal{text-align:left}}

/* barra de CTA no celular */
.mcta{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;display:none}
.mcta .btn{width:100%;box-shadow:0 12px 28px -10px rgba(26,46,108,.55)}
@media (max-width:820px){.js .mcta{display:block;transform:translateY(140%);transition:transform 260ms var(--ease)}.js .mcta.on{transform:none}}

/* entrada suave */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity 600ms var(--ease),transform 600ms var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .bars .b i{transform:scaleY(0);transition:transform 900ms var(--ease)}
.js .bars.in .b i{transform:none}
.js .bars.in .b:nth-child(2) i{transition-delay:90ms}.js .bars.in .b:nth-child(3) i{transition-delay:180ms}.js .bars.in .b:nth-child(4) i{transition-delay:270ms}.js .bars.in .b:nth-child(5) i{transition-delay:360ms}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none!important}
  .track{animation:none;flex-wrap:wrap;width:auto}.marquee{-webkit-mask-image:none;mask-image:none}.track .dup{display:none}
  .js .rv{opacity:1;transform:none}.js .bars .b i{transform:none}
}

.nf{min-height:70vh;display:grid;align-items:center}
.nf h1{color:var(--navy);margin-top:20px;max-width:16ch}
.nf .lede{margin-top:20px}
.nf .go{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="nf"><div class="wrap">
  <p class="eyebrow">Erro 404</p>
  <h1>Essa chave não abre nenhuma porta.</h1>
  <p class="lede">A página que você procurou mudou de lugar. Comece pelo diagnóstico ou volte para o início.</p>
  <div class="go"><a class="btn cta" href="/diagnostico/">Fazer meu diagnóstico</a><a class="btn line-navy" href="/">Voltar ao início</a></div>
</div></main>
</body>
</html>
